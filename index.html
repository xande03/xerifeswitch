    <style>
      /* Lock app shell: no rubber-band, no swipe-back, but keep horizontal carousels. */
      html, body {
        overscroll-behavior: none;
        overscroll-behavior-x: none;
        -webkit-overflow-scrolling: touch;
        overflow-x: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
        height: 100vh;
        height: 100dvh;
        /* manipulation = allow pan + pinch, block double-tap zoom.
           pan-y alone breaks horizontal scroll snap carousels on iOS. */
        touch-action: manipulation;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      /* Prevent text selection globally */
      * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Allow selection only in inputs */
      input, textarea, [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
      }
      /* Safe area variables for notched devices */
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
    </style>

    <!--
      Background-playback hardening (Brave-style "visibility trick").
      Many media sites use the Page Visibility API to auto-pause when the tab
      is hidden. We override the document-level signals on OUR origin so our
      own player code (and any same-origin embeds) never sees `hidden`.
      Cross-origin iframes (e.g. youtube.com) are NOT affected by this —
      that side is handled by useYouTubePlayer + MediaSession + native
      AVAudioSession (iOS) / Foreground Service plugin (Android).
    -->
    <script>
      (function () {
        try {
          var alwaysVisible = {
            get: function () { return 'visible'; },
            configurable: true,
          };
          var alwaysNotHidden = {
            get: function () { return false; },
            configurable: true,
          };
          Object.defineProperty(Document.prototype, 'visibilityState', alwaysVisible);
          Object.defineProperty(Document.prototype, 'hidden', alwaysNotHidden);
          Object.defineProperty(Document.prototype, 'webkitVisibilityState', alwaysVisible);
          Object.defineProperty(Document.prototype, 'webkitHidden', alwaysNotHidden);
          // Swallow visibilitychange events so 3rd-party libraries don't auto-pause.
          // Our app listens to `pagehide` / `pageshow` and MediaSession instead.
          document.addEventListener('visibilitychange', function (e) {
            if (document.visibilityState === 'visible') return;
            e.stopImmediatePropagation();
          }, true);
        } catch (err) {
          console.warn('[bg-playback] visibility shim failed:', err);
        }
      })();
    </script>

    <!--
      Restore the active module (hub/music/video/podcast) BEFORE React hydration
      so the correct accent color (blue/green/red/purple) paints from the very
      first frame after reload — no green→blue flash for the "Início" session.
      Reads `?module=podcast` first, then localStorage. Falls back to "hub".
    -->
    <script>
      (function () {
        try {
          var mod = "hub";
          var url = new URL(window.location.href);
          if (url.searchParams.get("module") === "podcast" ||
              localStorage.getItem("demus-podcast-mode") === "1") {
            mod = "podcast";
          } else {
            var hm = localStorage.getItem("demus-home-mode");
            if (hm === "music" || hm === "video" || hm === "hub") mod = hm;
          }
          document.documentElement.setAttribute("data-module", mod);
        } catch (e) {}
      })();
